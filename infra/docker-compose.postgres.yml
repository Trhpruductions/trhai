services:
  postgres:
    image: postgres:16
    container_name: ascend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ascend
    ports:
      - "5432:5432"
    volumes:
      - ascend_pg_data:/var/lib/postgresql/data

volumes:
  ascend_pg_data:
