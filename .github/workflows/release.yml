# Builds the Windows installer for a version tag and publishes it as a GitHub
# release, which is what every installed copy's update check reads
# (apps/api/src/services/updates.ts asks this repo's latest release).
#
# To release: bump "version" in apps/desktop/package.json, add a note for it
# in packages/shared/src/releaseNotes.ts, merge, then push a tag that matches:
#
#   git tag v0.1.5 && git push origin v0.1.5
#
# A release candidate - v0.1.5-rc.1 - is published the same way but marked a
# pre-release. Installed copies never offer one: the app's update check reads
# the latest release, which GitHub never sets to a pre-release, and the
# updater asks for releases only. So a candidate can be installed and updated
# to by hand (TRHAI_DESKTOP_UPDATE_URL pointed at its download folder) without
# reaching anyone.
#
# Nothing here signs the installer; that needs a certificate (docs/23).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The tag and the version the installer is named after must agree, or
      # the update check would offer a release whose download says otherwise.
      - name: Tag matches the product version
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)-rc\.\d+$') { $base = $Matches[1]; $candidate = "true" }
          elseif ($tag -match '^v(\d+\.\d+\.\d+)$') { $base = $Matches[1]; $candidate = "false" }
          else { throw "Tag $tag is neither vX.Y.Z nor vX.Y.Z-rc.N" }
          if ($base -ne $version) { throw "Tag $tag does not match apps/desktop/package.json version $version" }
          "candidate=$candidate" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: npm run package:win

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem apps/desktop/release -Filter "*.exe" | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw "Expected the Setup and Portable installers, found $($files.Count)" }
          # What the installed app's updater reads: latest.yml names the Setup
          # build and its SHA-512, and the blockmap lets it download only what changed.
          $files += @(Get-ChildItem apps/desktop/release -File | Where-Object { $_.Name -eq "latest.yml" -or $_.Name -like "*.blockmap" } | ForEach-Object { $_.FullName })
          if (-not ($files | Where-Object { $_ -like "*latest.yml" })) { throw "latest.yml was not built; the installed app could not update itself from this release" }
          # A checksum for every file, for anyone who downloads by hand.
          $sums = Join-Path apps/desktop/release "SHA256SUMS.txt"
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf) } | Set-Content -Path $sums -Encoding ascii
          $files += (Resolve-Path $sums).Path
          if ("${{ steps.tag.outputs.candidate }}" -eq "true") {
            gh release create "${{ github.ref_name }}" $files --title "TRH AI ${{ github.ref_name }} (release candidate)" --generate-notes --prerelease
          } else {
            gh release create "${{ github.ref_name }}" $files --title "TRH AI ${{ github.ref_name }}" --generate-notes
          }
